# Pre-commit hooks — the local enforcement point (this repo has no CI).
# Install once:  uv run pre-commit install
# Run manually:  uv run pre-commit run --all-files
#
# These make the safe path the lazy path: the kernel stays type-clean and the
# human-owned invariants spec can't be silently weakened alongside the code it
# checks. Both hooks are dev-only and never enter the container.
repos:
  - repo: local
    hooks:
      - id: invariants-guard
        name: spec-protection guard (tests/invariants is human-owned)
        entry: python3 scripts/invariants_guard.py
        language: system
        pass_filenames: false
        always_run: true

      # Separate stage, deliberately. git writes COMMIT_EDITMSG AFTER the
      # pre-commit hooks run, so a message check at pre-commit reads a stale
      # message from the previous commit. commit-msg is the stage where git
      # hands the real message to the hook.
      - id: invariants-revision-evidence
        name: spec revision requires the four-point protocol
        entry: python3 scripts/invariants_guard.py
        language: system
        stages: [commit-msg]
        always_run: true

      - id: ty-gate
        name: ty type-check gate (kernel + advisory, no new diagnostics beyond baseline)
        entry: uv run python scripts/ty_gate.py
        language: system
        pass_filenames: false
        # Must cover EVERY gated scope, not just the kernel. This was
        # ^trader/trading/.*\.py$, so a commit touching only trader/data/ or
        # trader/simulation/ skipped the hook entirely — meaning the advisory
        # "can only ratchet down" guarantee was unenforced on precisely the
        # commits able to break it. The gate itself checks all scopes; this
        # filter only decides when it RUNS, so it must be at least as wide.
        # Baselines/gate script included so a baseline edit is re-validated.
        # trader/strategy/ is matched whole (not just the two gated files) so a
        # NEW module there triggers the gate and the wiring test that demands it
        # be assigned a scope. Over-triggering is free — the gate decides what
        # it actually checks; under-triggering is how coverage rots.
        files: ^(trader/(trading|data|simulation|strategy)/.*\.py|trader/sdk\.py|scripts/ty_gate\.py|scripts/ty_baseline.*\.json)$

      # CrossHair symbolic-execution over the deal-contracted pure kernel.
      # MANUAL stage only: CrossHair spends tens of seconds per function via z3,
      # so it must NOT run on every commit. It is wired here so it is a
      # first-class, discoverable gate — run it after touching a contracted
      # function (order_math / position_sizing pure helpers / proposal
      # transitions), and in any nightly/CI job:
      #     uv run pre-commit run crosshair-check --hook-stage manual
      # or directly:  uv run python scripts/crosshair_check.py
      - id: crosshair-check
        name: crosshair symbolic check (deal contracts on the pure kernel)
        entry: uv run python scripts/crosshair_check.py
        language: system
        pass_filenames: false
        stages: [manual]
