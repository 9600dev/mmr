# TEMPLATE — copied to ~/.config/mmr/ on first run (container.ensure_config_dir,
# start_mmr.sh, docker-entrypoint.sh). Edits here do NOT affect a running
# system. The live config lives in ~/.config/mmr/ (bind-mounted into the
# container at /home/trader/.config/mmr/). Use this file to update defaults
# that ship with the repo for fresh installs only.
root_directory: .
port: 7425
# Zone every job's start/stop cron expression is written in (IANA name).
# A job may override it with its own `timezone:` key. Omit it entirely to
# fall back to the process's local time (legacy behaviour).
timezone: America/New_York
env: TRADER_CHECK=False
health_check_eval:
  - "exec('from trader.tools.trader_check import health_check') or health_check('~/.config/mmr/trader.yaml')"
jobs:
    - name: data_service
      description: historical data download service
      command: python3
      arguments: -m trader.data_service
      start: "* * * * *"
      start_on_pycron_start: True
      restart_if_found: False
      restart_if_finished: False
      delay: 5
    - name: trader_service
      description: service that abstracts over and interfaces with Interactive Brokers
      command: python3
      arguments: -m trader.trader_service
      start: "* * * * *"
      start_on_pycron_start: True
      restart_if_found: True
      restart_if_finished: True
      delay: 10
    - name: strategy_service
      description: service that loads, hosts and executes trading strategies and algorithms
      command: python3
      arguments: -m trader.strategy_service
      start: "* * * * *"
      start_on_pycron_start: True
      restart_if_found: True
      restart_if_finished: True
      depends_on:
        - trader_service
      delay: 15
    - name: web_dashboard
      description: read-only web dashboard (currencies, positions, strategies, proposals) on port 7424
      command: python3
      arguments: -m web.app
      start: "* * * * *"
      start_on_pycron_start: True
      restart_if_found: True
      restart_if_finished: True
      depends_on:
        - trader_service
      delay: 20
    # ---- declarative data refreshes (driven by data_refresh.yaml) ----
    # One-shot subprocesses on a schedule. Each cron entry calls
    # `mmr data refresh JOB [JOB ...]` with the job names declared in
    # data_refresh.yaml. Failures in one cron entry don't take down
    # pycron or the other entries.
    #
    # Cron expressions below are written in NY time and are evaluated in
    # the top-level `timezone:` (America/New_York), independent of the
    # container's TZ — no hand-shifting for PT/UTC hosts. If you delete
    # that key, expressions fall back to the container's local TZ.
    #
    # Two optional per-job keys (both default to 0 = off, the old behaviour):
    #
    #   catch_up_minutes: N   a scheduled instant that passed with the job
    #                         not run (stack down, host asleep) is run ONCE
    #                         when the scheduler is back, if it is at most N
    #                         minutes old ("CATCH-UP" in pycron_cron.log);
    #                         older than that it is logged "MISSED" and
    #                         recorded, not run. Catch-up runs go one at a
    #                         time, oldest instant first, and not before the
    #                         scheduler has been up for 5 minutes (top-level
    #                         `catch_up_settle_seconds`, default 300).
    #   timeout_minutes: N    a run still going after N minutes has its
    #                         process group terminated (SIGTERM, SIGKILL 10 s
    #                         later) and is recorded as a failure. Without it
    #                         a hung run counts as running for ever and the
    #                         job never fires again. Never set it on the
    #                         services above.
    #
    # Each job's last run (return code, failure streak, output tail, missed
    # instants) is in ~/.local/share/mmr/logs/pycron_status.json; a non-zero
    # exit is logged at ERROR. scripts/monitor_health.sh reports both.
    - name: data_refresh_us
      description: refresh US universes (TwelveData) — after US after-hours close
      command: python3
      arguments: -m trader.mmr_cli data refresh us_top20_daily us_top20_1min
      start: "0 23 * * 1-5"      # 11 PM ET weekdays. TwelveData 1-min bars
                                 # include pre (4-9:30 AM) + post (16-20:00 ET);
                                 # AH closes at 20:00.
                                 #
                                 # This was 20:30 ET, 30 min after the AH
                                 # close. That is enough for the 1-min bars and
                                 # NOT always enough for the DAILY bar, so the
                                 # job refreshed 1-min, found no daily bar yet,
                                 # and exited 0 — leaving the daily series one
                                 # session short with nothing reporting a
                                 # problem. A partial success still returns
                                 # success. Observed 2026-07-27: the run wrote
                                 # Friday's daily bar and missed Monday's.
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
      catch_up_minutes: 240      # until 03:00 ET — before the next session's
                                 # pre-market opens at 04:00
      timeout_minutes: 90
    - name: data_audit
      description: quality-gate the stored OHLCV against the recorded baseline
      command: python3
      arguments: -m trader.mmr_cli data audit
      # After BOTH refresh jobs (US 23:00 ET, ASX 06:00 ET), so it grades the
      # data the strategies will actually read tomorrow. Exits non-zero on a
      # NEW violation, which is the whole point: a one-off audit is worthless
      # because the data changes nightly.
      start: "0 7 * * 1-5"
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
      catch_up_minutes: 240      # caught up after the refreshes it grades
                                 # (oldest missed instant runs first)
      timeout_minutes: 60
    - name: data_refresh_asx
      description: refresh ASX universes (IB) — after ASX close
      command: python3
      arguments: -m trader.mmr_cli data refresh asx_daily asx_1min
      start: "0 6 * * 1-5"       # 6:00 AM ET Mon-Fri = 10:00 UTC = 20:00 AEST,
                                 # ~4 h after the Sydney close.
                                 #
                                 # This was 16:30 AEST, i.e. 20 min after the
                                 # 16:10 closing auction. Same race the US job
                                 # had: enough for the 1-min bars, not for the
                                 # DAILY bar, so the job exited 0 having
                                 # refreshed 1-min and skipped the daily
                                 # series. Confirmed 2026-07-28: the 16:30 AEST
                                 # run did not pick up that day's ASX daily
                                 # bar. The wide buffer also absorbs the US/AU
                                 # daylight-saving drift, which moves the two
                                 # zones up to 2 h relative to each other.
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
      catch_up_minutes: 240      # until 10:00 ET — hours before the next
                                 # Sydney open
      timeout_minutes: 90
    - name: db_backup
      description: clean DuckDB snapshot to the host-mounted backups/ dir
      command: python3
      arguments: -m trader.mmr_cli data backup --keep 7
      start: "17 22 * * *"       # 10:17 PM daily — after both data-refresh jobs
                                 # (ASX 16:30, US 20:30) and before the IB Gateway
                                 # nightly restart (~23:59). Snapshots survive
                                 # volume loss / rebuilds; keeps the newest 7.
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
      catch_up_minutes: 240      # a snapshot up to 4 h late is still last
                                 # night's; later than that, wait for tonight
      timeout_minutes: 60
    # ---- paper sleeves: the daily books, and the monthly decision ----
    # docs/LOWFREQ_LIVE.md's "every session after the close" and "once a
    # month" steps as one job (scripts/sleeve_upkeep.py): refresh the
    # point-in-time bars, reconcile fills into each sleeve's journal, track its
    # paper ledger — and, when the session was the first of its month, refresh
    # fundamentals, write the targets file and save a dry-run plan. It never
    # proposes or approves. Without it nothing kept a sleeve's books: found on
    # 2026-11-15 with bars six weeks stale, no journal and an empty ledger.
    # A no-op when there is no sleeve. The monthly part needs SEC_API_KEY in
    # the container (docker-compose.yml forwards it from the host).
    - name: sleeve_upkeep
      description: paper sleeves — bars, reconcile, ledger; targets + dry-run plan on a month's first session
      command: python3
      arguments: scripts/sleeve_upkeep.py
      start: "30 23 * * 1-5"     # 23:30 ET Mon-Fri: after the US refresh
                                 # (23:00), late enough for the vendor's daily
                                 # bars, hours before the next open.
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
      catch_up_minutes: 240      # until 03:30 ET; the decision must exist
                                 # before the next session opens
      timeout_minutes: 45
    # ---- pre-open readiness preflights ----
    # `mmr preflight` runs the verify checks (live IB round-trip via ping_ib,
    # armed roster RUNNING, services responsive) and appends one
    # "PREFLIGHT OK|FAIL: ..." line to ~/.local/share/mmr/logs/preflight.log —
    # a hung gateway or missing roster is caught BEFORE the open instead of
    # by missing trades after it. Same TZ caveat as the refresh jobs above.
    - name: preflight_us
      description: pre-open stack readiness check ~30 min before the US open
      command: python3
      arguments: -m trader.mmr_cli preflight
      start: "0 9 * * 1-5"       # 9:00 AM ET weekdays — 30 min before the
                                 # 09:30 NYSE/NASDAQ open.
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
      # No catch_up_minutes, deliberately: a preflight run hours late says
      # nothing about readiness at the open. A missed one is logged MISSED.
      timeout_minutes: 5
    - name: preflight_asx
      description: pre-open stack readiness check ~30 min before the ASX open
      command: python3
      arguments: -m trader.mmr_cli preflight
      start: "30 19 * * 0-4"     # 7:30 PM ET Sun-Thu = 09:30 AEST Mon-Fri —
                                 # 30 min before the 10:00 Sydney open.
      start_on_pycron_start: False
      restart_if_found: False
      restart_if_finished: False
      timeout_minutes: 5         # no catch_up_minutes — see preflight_us
