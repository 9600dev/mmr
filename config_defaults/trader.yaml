# TEMPLATE — copied to ~/.config/mmr/ on first run (container.ensure_config_dir,
# start_mmr.sh, docker-entrypoint.sh). Edits here do NOT affect a running
# system. The live config lives in ~/.config/mmr/ (bind-mounted into the
# container at /home/trader/.config/mmr/). Use this file to update defaults
# that ship with the repo for fresh installs only.
# MMR Configuration
# User configs live in ~/.config/mmr/ (copied from bundled configs on first run)
# Environment variables override these values (uppercase param name)

root_directory: .
config_file: ~/.config/mmr/trader.yaml
pycron_config_file: ~/.config/mmr/pycron.yaml
strategy_config_file: ~/.config/mmr/strategy_runtime.yaml
logfile: ~/.local/share/mmr/logs/trader.log
strategies_directory: strategies

# Trading mode: 'paper' or 'live'
# This selects which account and port are used.
trading_mode: paper

# Hard gate: when true, trader_service refuses direct buy/sell RPCs
# (mmr buy / mmr sell / MMRHelpers.sell/buy / cli("buy ...")). Every
# actionable new trade must go through propose → approve. Liquidation
# paths (close-all, resize-positions) bypass via skip_risk_gate=True.
# Strongly recommended for live trading with any autonomous agent in
# the loop. Off by default so paper / manual workflows aren't disturbed.
require_proposal_approval: false

# Server-side notional tier (Phase 2 proposer/approver split).
# When approver_required_above_usd > 0, an exposure-INCREASING order whose
# SERVER-RECOMPUTED notional exceeds this threshold requires a matching
# approver_key (constant-time compared) before trader_service will place it.
# The tier now covers EVERY exposure-increasing server path — both the
# approve() proposal flow AND the direct buy/sell path (place_order_simple /
# executioner) — enforced in one place (Trader.enforce_approver_tier). It
# values a PURE open at max(client limit, live snapshot), so a proposer cannot
# forge the valuation downward with a lowball marketable limit. It fails CLOSED
# when the notional can't be valued (no usable price).
# 0 (default) => feature OFF, byte-identical to prior behaviour.
# Exit-class orders (any order_reduces_exposure order — closes AND an oversized
# "flip" that crosses zero) are EXEMPT and never gated (roadmap principle 2 —
# a reduction is never blocked by an approval requirement). A flip's net-new
# opening remainder is a documented residual (SAFETY_ROADMAP), closed by
# turnover caps / order-splitting, not by refusing the reduction. Concretely: a
# close never needs a key. The auto-executor is kept BELOW the threshold by
# position sizing, so it carries no key and is unaffected: set the threshold
# ABOVE the auto-executor's max sized notional (see position_sizing.yaml
# max_position_usd).
approver_required_above_usd: 0

# The approver key's canonical source is the MMR_APPROVER_KEY process env var,
# which WINS over this YAML value. Deliver it OUT OF BAND — a typed
# `mmr approve --approver-key ...` or a services-only secrets.env / child-env
# export. Do NOT put it in docker-compose `environment:`, .mmr_env, or
# ~/.config (all leak to a docker-exec / same-container proposer). Empty
# (default) => no key configured; with the threshold on, all above-threshold
# opens are refused.
approver_key: ''

# Interactive Brokers connection
# Set both accounts — trading_mode picks the active one.
# IB_ACCOUNT env var overrides the auto-selected account.
# IB_SERVER_PORT env var overrides the auto-selected port.
ib_server_address: 127.0.0.1
ib_paper_account: ''
ib_live_account: ''
ib_paper_port: 7497
ib_live_port: 7496
trading_runtime_ib_client_id: 5
strategy_runtime_ib_client_id: 7

# DuckDB storage
# All persistent data lives in ~/.local/share/mmr/ (same location for Docker and local)
# duckdb_path: trading data (events, proposals, groups, universes)
# history_duckdb_path: OHLCV bars (separate file avoids lock contention with trading services)
duckdb_path: ~/.local/share/mmr/data/mmr.duckdb
history_duckdb_path: ~/.local/share/mmr/data/mmr_history.duckdb
universe_library: 'Universes'

# Pycron process manager
pycron_server_address: 127.0.0.1
pycron_server_port: 7425

# ZeroMQ messaging
zmq_rpc_server_address: tcp://127.0.0.1
zmq_rpc_server_port: 42001
zmq_pubsub_server_address: tcp://127.0.0.1
zmq_pubsub_server_port: 42002
zmq_strategy_rpc_server_address: tcp://127.0.0.1
zmq_strategy_rpc_server_port: 42005
zmq_messagebus_server_address: tcp://127.0.0.1
zmq_messagebus_server_port: 42006
zmq_data_rpc_server_address: tcp://127.0.0.1
zmq_data_rpc_server_port: 42003

# Massive.com (formerly Polygon.io)
massive_api_key: ''
massive_feed: stocks
massive_delayed: false

# TwelveData (parallel history backend; set TWELVEDATA_API_KEY env var as alternative)
twelvedata_api_key: ''

# CLI default for --source on commands that take it (history download,
# snapshot, watch, financials, fx, movers, ideas). Per-command --source
# arguments still win. Override per-shell with MMR_DEFAULT_DATA_SOURCE.
# Recognised values: massive, twelvedata, ib (only used where the choice
# set for that command includes it; otherwise the command's own default
# applies).
default_data_source: twelvedata

# Equity-curve decimation at backtest-persist time. The full per-bar
# series is ~9.9 MB per 1-min run (4,713 runs took ~47 GB pre-fix);
# daily decimation drops this to ~17 KB with no statistical loss for
# PSR/Sharpe-CI (both n>=30, daily gives n=252). Override per-shell
# with MMR_EQUITY_DECIMATION.
#   daily     resample to last-value-per-day (recommended)
#   none      no decimation (legacy bloat)
#   <int>     uniform sample down to N points
equity_decimation: daily
