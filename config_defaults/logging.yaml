# TEMPLATE — copied to ~/.config/mmr/ on first run (container.ensure_config_dir,
# start_mmr.sh, docker-entrypoint.sh). Edits here do NOT affect a running
# system. The live config lives in ~/.config/mmr/ (bind-mounted into the
# container at /home/trader/.config/mmr/). Use this file to update defaults
# that ship with the repo for fresh installs only.
version: 1
disable_existing_loggers: false

formatters:
    standard:
        format: "%(asctime)s::%(name)s::%(levelname)s::%(message)s"
    rich_standard:
        format: "[%(name)s] %(message)s"
    error:
        format: "%(asctime)s %(levelname)s <PID %(process)d:%(processName)s> %(name)s.%(funcName)s(): %(message)s"

# NOTE on `delay: true` (on every RotatingFileHandler below): without it the
# handler creates its file at config time, so EVERY process that loads this
# config — each `mmr` CLI run, each 60s container healthcheck, each pytest
# session — left behind a full set of empty session-stamped files. That had
# accumulated to 41,044 empty files (of 43,462) by 2026-07-24, which the
# monitor scripts have to scan past to find the newest *non-empty* log.
# With delay, the file is created on first actual write, so a process that
# logs nothing to a given handler leaves nothing behind.
handlers:
    console:
        class: logging.StreamHandler
        level: DEBUG
        formatter: standard
        stream: ext://sys.stdout

    rich_console:
        class: rich.logging.RichHandler
        rich_tracebacks: True
        show_path: False
        omit_repeated_times: False
        level: DEBUG
        formatter: rich_standard

    trader_service_handler:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: standard
        filename: ~/.local/share/mmr/logs/trader_service.log
        maxBytes: 10485760 # 10MB
        backupCount: 20
        encoding: utf8
        delay: true

    strategy_service_handler:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: standard
        filename: ~/.local/share/mmr/logs/strategy_service.log
        maxBytes: 10485760 # 10MB
        backupCount: 20
        encoding: utf8
        delay: true

    data_service_handler:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: standard
        filename: ~/.local/share/mmr/logs/data_service.log
        maxBytes: 10485760 # 10MB
        backupCount: 20
        encoding: utf8
        delay: true

    file_handler:
        class: logging.handlers.RotatingFileHandler
        level: INFO
        formatter: standard
        filename: ~/.local/share/mmr/logs/trader.log
        maxBytes: 10485760 # 10MB
        backupCount: 20
        encoding: utf8
        delay: true

    error_file_handler:
        class: logging.handlers.RotatingFileHandler
        level: ERROR
        formatter: error
        filename: ~/.local/share/mmr/logs/errors.log
        maxBytes: 10485760 # 10MB
        backupCount: 20
        encoding: utf8
        delay: true

    # The one log that is NOT session-stamped (see _UNSTAMPED_LOGS in
    # trader/common/logging_helper.py): a single rotating file spanning
    # sessions, so triage has one place to look. Lives in the bind-mounted
    # logs dir — host-tailable, and writable by whatever uid the services
    # run as (it was /tmp/debug.log, which root-owned services made
    # unwritable for `mmr` CLI runs under uid trader).
    #
    # Rotation caveat: RotatingFileHandler is NOT multi-process safe, and this
    # is the one file every process shares (4 services + pycron + every CLI
    # run, and since the move off /tmp, host-side runs too — same bind mount).
    # When one process rolls the file the others keep writing to the renamed
    # inode until they roll too, so lines can land in debug.log.1. Harmless for
    # triage, but the mitigation is to roll RARELY: 64MB x 3 keeps the same
    # ~200MB ceiling as the old 10MB x 20 while rotating ~6x less often.
    debug_file_handler:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: standard
        filename: ~/.local/share/mmr/logs/debug.log
        maxBytes: 67108864 # 64MB
        backupCount: 3
        encoding: utf8
        delay: true

root:
    level: NOTSET
    handlers: [rich_console, file_handler, error_file_handler, debug_file_handler]

loggers:
    urllib3:
        level: WARNING
        propagate: no
    urllib3.connectionpool:
        level: WARNING
        propagate: no
    ib_async.client:
        level: WARNING
        handlers: [rich_console, debug_file_handler]
        propagate: no
    ib_async.wrapper:
        level: WARNING
        handlers: [rich_console, debug_file_handler]
        propagate: no
    ib_async.ib:
        level: WARNING
        handlers: [rich_console, debug_file_handler]
        propagate: no
    # NOTE on `propagate: yes` (deliberate, was a silent `propogate` typo for
    # years): service loggers write their own file AND propagate to root
    # (console via rich_console, trader.log at INFO+, logs/debug.log at DEBUG,
    # errors.log — the last doubles with the logger's own error_file_handler,
    # accepted). Propagation is load-bearing: logs/debug.log stays a complete
    # single-file triage log, and pytest's caplog captures via root. The
    # monitors don't depend on it either way — they read the service files.
    data_service:
        level: DEBUG
        handlers: [data_service_handler, error_file_handler]
        propagate: yes
    ib_history:
        level: DEBUG
        handlers: [data_service_handler, error_file_handler]
        propagate: yes
    trader_service:
        level: DEBUG
        handlers: [trader_service_handler, error_file_handler]
        propagate: yes
    trading_runtime:
        level: DEBUG
        handlers: [trader_service_handler, error_file_handler]
        propagate: yes
    # ibreactivex (IBAIORx) carries the IB connectivity/farm-status lines the
    # health monitor needs — route it into the trader_service log (it used to
    # fall through to root only, leaving trader_service_<ts>.log blind to
    # connectivity events).
    ibreactivex:
        level: DEBUG
        handlers: [trader_service_handler, error_file_handler]
        propagate: yes
    strategy_service:
        level: DEBUG
        handlers: [strategy_service_handler, error_file_handler]
        propagate: yes
    strategy_runtime:
        level: DEBUG
        handlers: [strategy_service_handler, error_file_handler]
        propagate: yes
    # auto_executor's OPENED/CLOSING/CLOSED/CLOSE FAILED audit lines belong in
    # the strategy_service log next to the signals that caused them — the
    # trading monitor watches one file.
    auto_executor:
        level: DEBUG
        handlers: [strategy_service_handler, error_file_handler]
        propagate: yes
