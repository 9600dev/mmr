[project]
name = "mmr"
version = "0.1.0"
description = "Make Me Rich - Algorithmic Trading Platform"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13",
    "backoff>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.7",
    "pymdown-extensions>=10.0",
    "nh3>=0.2",
    "beautifulsoup4>=4.14",
    "bs4",
    "click>=8.3",
    "click-help-colors>=0.9",
    "click-option-group>=0.5",
    "click-repl>=0.3",
    "cloup>=3.0",
    "coloredlogs>=15.0",
    "configobj>=5.0",
    "crontab>=1.0",
    "dateparser>=1.3",
    "dill>=0.4",
    "duckdb>=1.4",
    "durations>=0.3",
    "eventkit>=1.0.0",
    "exchange-calendars>=4.13",
    "expression>=5.6",
    "ib_async>=2.1",
    "ipython>=9.10",
    "lxml>=6.0",
    "matplotlib>=3.10",
    "msgpack>=1.1",
    "numpy>=2.4",
    "pandas>=3.0",
    "plotext>=5.3",
    "plotille>=6.0",
    "plotly>=6.5",
    "prompt-toolkit>=3.0",
    "psutil>=7.2",
    "pyarrow>=23.0",
    "python-dateutil>=2.9",
    "pyfiglet>=1.0",
    "pypager>=3.0",
    "pytz>=2025.2",
    "pyyaml>=6.0",
    "pyzmq>=27.1",
    "reactivex>=4.1",
    "requests>=2.32",
    "httpx>=0.27",
    "rich>=14.3",
    "scikit-learn>=1.8",
    "scipy>=1.17",
    "tabulate>=0.9",
    "textual>=8.0",
    "tornado>=6.5",
    "uniplot>=0.21",
    "vectorbt>=0.28",
    "massive>=2.2.0",
    "twelvedata[pandas]>=1.3",
    "pydantic>=2.13.4",
    "deal>=4.24.6",
    "pandas-market-calendars>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "isort>=5.13",
    "ty==0.0.63",  # pre-1.0 preview: exact-pin so type-check results are reproducible
    "pre-commit>=4.6.1",
    "crosshair-tool>=0.0.109",  # symbolic-execution checker for deal contracts (dev-only)
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
]
streaming = [
    "websocket-client>=1.8",
]

[project.scripts]
trader-service = "trader.trader_service:main"
strategy-service = "trader.strategy_service:main"
data-service = "trader.data_service:main"
mmr = "trader.mmr_cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trader*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.isort]
multi_line_output = 3
force_alphabetical_sort = true
from_first = false
line_length = 110
lines_after_imports = 2

# ty (Astral) — dev-only static type checker, run via `uv run ty check`.
# Pinned in the dev extra (pre-1.0 preview). The kernel (trader/trading/) is
# the enforced scope; scripts/ty_gate.py gates on "no diagnostics beyond the
# recorded baseline" so new code must type-check while the pre-existing set is
# burned down per-file. The rest of the tree is checked but not gated yet.
[tool.ty.environment]
python-version = "3.12"
root = ["."]

# mutmut (dev-only) — mutation testing that "verifies the verifier": it mutates
# the pure safety kernel and checks the kernel test suite (esp. tests/invariants/)
# actually catches the change. Run via scripts/run_mutation.sh (see that file).
# Scope is kept TIGHT (mutation re-runs tests per mutant) to the four
# safety-critical modules: the pure cores order_math + proposal_transitions
# first, then position_sizing + risk_gate. source_paths copies the whole
# `trader` package into mutants/ so non-mutated imports still resolve to the
# mutated tree; only_mutate restricts which files actually get mutants.
# NOTE: mutmut 3.x runs pytest IN-PROCESS, so it must be invoked with the
# canonical env interpreter (~/miniforge3/envs/mmr/bin/python3 -m mutmut) — the
# tests then run under exactly that interpreter. mutmut is not a runtime dep;
# install it into the test env only (pip install mutmut==3.6.0).
[tool.mutmut]
source_paths = ["trader"]
# Copied into mutants/ and loaded via -p below: a Hypothesis harness shim that
# suppresses the differing_executors health check mutmut's two-session model
# provokes (see _mutmut_hyp.py). Inert for the normal test suite.
also_copy = ["_mutmut_hyp.py"]
pytest_add_cli_args = ["-p", "_mutmut_hyp"]
only_mutate = [
    "trader/trading/order_math.py",
    "trader/data/proposal_transitions.py",
    # The exit-class decision: a True answer disables the trading filter, the
    # leverage check, the risk gate, require_proposal_approval AND the approver
    # tier at once, so it is the highest-consequence boolean in the system. It
    # lived inline in trading_runtime.py (outside this scope) and was mocked in
    # the invariants spec, so a targeted backdoor -- `if qty > 1000: return True`,
    # permitting unlimited naked shorts through every gate -- survived all 1882
    # tests. Extracted to a pure module precisely so it lands here.
    "trader/trading/exit_class.py",
    # The last structural check before IB. It existed for years wired only to
    # the manual buy/sell path; the automated paths (approve, AutoExecutor,
    # bracket legs, protective stops) reached IB unchecked. Extracted pure and
    # moved to the placement chokepoint — and therefore measured here.
    "trader/trading/order_structure.py",
    # The disaster stop's size and price: the only protection that survives a
    # dead feed while holding, and it lived inline between two SDK calls.
    "trader/trading/protective_stop.py",
    # Decomposes a position-crossing order into its unrefusable reduction and
    # its gated remainder. Closes the flip residual; a wrong split either
    # refuses a close or re-opens the hole.
    "trader/trading/order_split.py",
    # The order-outcome recorder: the PnL ledger pairs the ORDER_FILLED events
    # it writes, and the live Cancelled->Filled race (d23746d) proved a wrong
    # record silently corrupts realized PnL. Small, pure-ish, high-consequence.
    "trader/trading/order_lifecycle.py",
    # The quality rules for stored bars. Nothing verified the DATA until
    # 2026-07-28; the first run found 2,580 structurally impossible 1-min bars
    # (highs below the close, from quote-midpoint synthesis). A wrong rule here
    # either buries that finding or floods the report with false alarms.
    "trader/data/bar_quality.py",
    # Point-in-time fundamentals. Using the period-end date instead of the
    # filing acceptance time trades on results 18-60 days before they were
    # public, and produces a beautiful equity curve while doing it.
    "trader/data/fundamentals.py",
    # Selection-bias correction. Not on the order path, but it is what says
    # whether a strategy family is real, and its failure mode is silent: a
    # deflation that never deflates, or a PBO that never reaches 0.5, would
    # rubber-stamp the whole roster while looking like diligence.
    "trader/simulation/selection_bias.py",
    # Walk-forward fold planning. The leakage property (a fold's test window
    # never begins before its training window ends) is arithmetic, invisible
    # in any summary of the output, and would silently turn walk-forward back
    # into the in-sample selection it exists to replace.
    "trader/simulation/walk_forward.py",
    # Weight -> share translation for cross-sectional books. Every failure
    # mode is silent: it changes leverage or liquidates a position without
    # raising, and the equity curve still looks plausible.
    "trader/simulation/panel.py",
    # Signal evaluation. The forward-return alignment fails invisibly: off by
    # one and you correlate a signal with the return that produced it, which
    # yields a large stable fake IC that looks exactly like a discovery.
    "trader/simulation/signal_eval.py",
    # Signal combination and neutralisation. Cross-sectional standardisation
    # done on the wrong axis is a lookahead leak that produces a well-behaved
    # frame of plausible numbers.
    "trader/simulation/signal_combine.py",
    # Decides which bars a strategy is allowed to see at all. Not on the
    # order path, but a wrong answer either starves a strategy of real bars
    # or feeds it bars that never traded.
    "trader/data/market_session.py",
    "trader/strategy/auto_executor.py",
    "trader/trading/position_sizing.py",
    "trader/trading/risk_gate.py",
]
